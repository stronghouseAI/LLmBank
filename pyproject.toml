[project]
name = "stronghouse"
version = "0.1.0"
description = "StronghouseAI: run big local LLMs on moderate hardware and keep an offline archive of them."
readme = "README.md"
requires-python = ">=3.12"
# Kept deliberately small (rule 09). Every addition needs a reason in docs/adr.
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
]

[project.scripts]
stronghouse = "stronghouse.__main__:main"
shai = "stronghouse.cli.commands:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
    "pre-commit==4.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stronghouse"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
